---
# Zitadel (identity provider) at <auth_host>.${base_domain}. Instantiated from the
# platform's tenant-namespace template (quota, limit defaults, tenant isolation),
# plus a CloudNativePG database, ESO-managed secrets, and the Zitadel HelmRelease.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth
resources:
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - networkpolicy.yaml
  - secrets.yaml
  - database.yaml
  - repository.yaml
  - release.yaml
  - ingress.yaml
