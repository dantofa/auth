---
# The Zitadel masterkey encrypts secrets at rest in the database, so it is
# source-of-truth: a recovered database is unreadable without the same key. It
# therefore lives in Bitwarden, not in a generator.
#
# ACTION REQUIRED: create the bws secret ZITADEL_MASTERKEY (exactly 32 characters)
# in the cluster's Bitwarden project before the first reconcile, e.g.
#   bws secret create ZITADEL_MASTERKEY "$(tr -dc A-Za-z0-9 </dev/urandom | head -c32)" "$BWS_PROJECT_ID"
# Never rotate it in place: Zitadel cannot decrypt existing data with a new key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: zitadel-masterkey
  data:
    - secretKey: masterkey
      remoteRef:
        key: ZITADEL_MASTERKEY
---
# Initial password for the first-instance human admin. Disposable: Zitadel stores
# its own hash at first setup (and forces a change on first login), so a cluster-
# local generated value is enough. CreatedOnce keeps it stable across refreshes.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zitadel-admin-password
spec:
  length: 24
  digits: 4
  symbols: 4
  symbolCharacters: "!#%*+-=?@^_"
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-admin
spec:
  refreshPolicy: CreatedOnce
  target:
    name: zitadel-admin
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zitadel-admin-password
