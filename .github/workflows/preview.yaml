---
name: preview
# One ephemeral DOKS cluster per pull request, via the dantofa platform's reusable
# workflow: cluster auth-pr<N>, base domain auth-pr<N>.${PREVIEW_DOMAIN}, Zitadel at
# auth.<that>. The platform orders the base domain's Cloudflare edge certificate at
# bootstrap and deletes it with the cluster on close.
#
# Off until the PREVIEW_DOMAIN variable (repo or org) is set. Needs the
# BWS_ACCESS_TOKEN secret; every other credential (DigitalOcean, Cloudflare) is read
# from the bws project, whose ids are the ones in devbox.json. Fork PRs are skipped
# by the reusable workflow: they get no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions: {}
jobs:
  preview:
    if: vars.PREVIEW_DOMAIN != ''
    permissions:
      contents: read
      deployments: write
    # Same platform commit as devbox.lock.
    uses: dantofa/platform/.github/workflows/preview.yml@cb1aaf2f538bf662ddb2e7aa56cfbaf8c1a8f62d
    with:
      cluster_prefix: auth-pr
      domain_suffix: ${{ vars.PREVIEW_DOMAIN }}
      bws_project_id: 8adeb984-2d51-4701-bd80-b3a3018260ea
      bws_organization_id: ae067a82-b49c-4ab3-80a8-af2401187fc1
      deploy: just deploy-doks
      verify: just verify
      environment_url: "https://auth.{base_domain}"
    secrets:
      bws_access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
